<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 1.0, "parents": "seed", "role": "Best", "components": {"gerador.generate_sql.predict": "Generate a SQLite query from a natural language question (in Portuguese).\nUse only the tables and columns described in dbschema.\nFor calculated columns (SUM, COUNT, AVG, etc.), always give a readable alias\nin Portuguese snake_case, e.g. SUM(estoque * preco) AS total_em_reais.\nWhen erro_anterior is not empty, it contains the queries you already tried\nand the errors they raised: write a different query that fixes them, never\nthe same one again.\nReturn only the SQL query, without comments."}},
{"idx": 1, "score": 1.0, "parents": "0", "role": "", "components": {"gerador.generate_sql.predict": "Generate a SQLite query from a natural language question (in Portuguese).\n\nInstructions and Constraints:\n1. **Database Scope:** Use ONLY the tables and columns strictly defined in the provided `dbschema`. Do not introduce external tables or columns.\n2. **Calculated Columns Aliasing:** For any aggregate functions (SUM, COUNT, AVG, etc.), you must provide a clear, readable alias in Portuguese snake_case (e.g., `SUM(estoque * preco) AS total_em_reais`).\n3. **Relational Logic (JOINs):** When a question requires data from multiple tables (e.g., linking product names to location details, or filtering products by category names), you must correctly implement the necessary JOIN operations.\n4. **Data Type Handling:** Pay close attention to how data types are used, especially when filtering by specific criteria (like matching product names, unit measures, or date formats).\n5. **Error Correction Protocol:** If `erro_anterior` is not empty, it contains previously attempted queries and the errors they raised. You must write a completely different and corrected query that resolves the issue, ensuring you do not repeat any previous failed query.\n6. **Output Format:** Return only the final SQL query, without any explanatory text, comments, or markdown wrappers.\n\n**General Strategy:**\n*   Analyze the NL question to identify the necessary tables and columns.\n*   Determine the required operations (SELECT, WHERE, ORDER BY, JOIN, GROUP BY, LIMIT).\n*   Translate the logic into accurate SQLite syntax, strictly adhering to the provided schema.\n*   Ensure that complex queries requiring joins (like finding location based on product name) are constructed correctly."}},
{"idx": 2, "score": 0.9333, "parents": "1", "role": "Pareto Front", "components": {"gerador.generate_sql.predict": "Generate a highly accurate SQLite query based on a natural language question provided in Portuguese. Your primary function is to translate the user's request into valid SQLite syntax, strictly adhering to the provided `dbschema`.\n\nInstructions and Constraints:\n\n1. **Schema Fidelity:** You must use ONLY the tables and columns explicitly defined in the provided `dbschema`. Do not infer or introduce any external tables or columns.\n2. **SQL Syntax and Logic:** Accurately determine the necessary operations (SELECT, WHERE, ORDER BY, JOIN, GROUP BY, LIMIT) to satisfy the NL question. Complex queries requiring data from multiple tables (e.g., linking product details to category names or supplier information) must be correctly implemented using appropriate JOIN operations.\n3. **Calculated Column Aliasing (Mandatory):** For all aggregate functions (SUM, COUNT, AVG, MIN, MAX, etc.), you must provide a clear, readable alias using Portuguese snake_case (e.g., `SUM(estoque * preco) AS total_em_reais`).\n4. **Data Type and Filtering Accuracy:** Pay close attention to the specified data types (TEXT, REAL, INTEGER) and formats (especially for dates like YYYY-MM-DD). Ensure filtering conditions (matching product names, unit measures, or date ranges) are syntactically correct for SQLite.\n5. **Strict Output Format:** Return ONLY the final, executable SQLite query. Do not include any explanatory text, comments, markdown wrappers (like ```sql), or reasoning.\n6. **Error Correction Protocol (`erro_anterior`):** If the `erro_anterior` field is populated, it contains previous failed attempts and their associated errors. You must write a completely different, fully corrected query that resolves the underlying issue. You must ensure this new query is logically distinct from any previous failed attempt.\n\n**General Strategy:**\n*   **Analyze the NL question:** Identify the target information and the required output fields.\n*   **Map Requirements to Schema:** Determine which tables and columns are necessary.\n*   **Determine Logic Flow:** Identify the required operations (filtering via WHERE, aggregating via GROUP BY/SUM/COUNT, linking via JOINs, sorting via ORDER BY).\n*   **Translate to SQLite:** Construct the query step-by-step, ensuring strict adherence to the schema and the required aliasing format."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(1.00)", fillcolor=cyan, tooltip=" "];
    1 [label="1\\n(1.00)", fillcolor=lightgray, tooltip=" "];
    2 [label="2\\n(0.93)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    1 -> 2;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
